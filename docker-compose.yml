services:
  # Base de Datos PostgreSQL con soporte de PgVector
  db-aprend-ia:
    container_name: aprendia_db
    # PG_MAJOR debe coincidir con la versión mayor del servidor de origen (Neon) para que pg_restore sea compatible
    image: pgvector/pgvector:pg${PG_MAJOR:-16}
    restart: always
    # Publicado solo en loopback: accesible desde la VPS (túnel SSH / psql local), nunca desde internet.
    # Docker inserta sus reglas antes que UFW, por eso el bind a 127.0.0.1 es obligatorio.
    ports:
      - "127.0.0.1:${DB_PORT_EXT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-aprendia_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
      POSTGRES_DB: ${DB_NAME:-aprendiadb}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-aprendia_app} -d ${DB_NAME:-aprendiadb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aprendia_network

  # Servicio de API Backend Spring Boot
  aprendia-api:
    container_name: aprendia_api
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # Solo loopback: Nginx (proxy_pass http://127.0.0.1:8080) es el único punto de entrada público.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    # Carga todas las variables del .env (MAIL_PROVIDER, MAIL_API_KEY, OTP_*, SERVER_CONTEXT_PATH, etc.).
    # Las claves de "environment" tienen prioridad sobre las del env_file.
    env_file:
      - .env
    environment:
      # Configuración de base de datos (host interno de la red de Docker)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-aprend-ia:5432/${DB_NAME:-aprendiadb}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-aprendia_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}

      # El contenedor siempre escucha en 8080; APP_PORT solo define el puerto publicado en el host
      APP_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod

      # Variables obligatorias: el arranque falla si no están definidas
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Defina ENCRYPTION_SECRET en el archivo .env}

      # Zona horaria de la JVM (marcas de tiempo de logs y auditoría)
      TZ: America/Mexico_City
    depends_on:
      db-aprend-ia:
        condition: service_healthy
    networks:
      - aprendia_network

volumes:
  db_data:
    # Nombre distinto al volumen del despliegue anterior (aprendia_db_data), que se conserva como respaldo
    name: aprendia_pgdata

networks:
  aprendia_network:
    name: aprendia_network
    driver: bridge
