server:
  port: ${APP_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}

spring:
  application:
    name: aprendia-backend
  
  # Multipart properties
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # Database configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aprendiadb}
    username: ${SPRING_DATASOURCE_USERNAME:aprendia_app}
    password: ${SPRING_DATASOURCE_PASSWORD:Apr3nd1A_DB_!S3cur3Pa$$2026}
    driver-class-name: org.postgresql.Driver

  # Correo (envío del código OTP). Sin MAIL_HOST el envío falla de forma explícita.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  # Flyway Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# JWT Config (Custom application properties)
app:
  jwt:
    secret: ${JWT_SECRET:aprendia_super_secret_jwt_key_2026_secure_algorithm_for_signatures}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours in ms
    header: Authorization
    prefix: "Bearer "
  security:
    api-key-rotation:
      # "-" desactiva la rotación automática de API keys. Ej. trimestral: "0 0 0 1 1/3 ?"
      cron: ${API_KEY_ROTATION_CRON:-}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:4200}
  encryption:
    secret: ${ENCRYPTION_SECRET:aprendia_encryption_secret_key_2026}
  mail:
    from: ${MAIL_FROM:no-reply@aprendia.local}
  otp:
    expiration-seconds: ${OTP_EXPIRATION_SECONDS:300}
    cooldown-seconds: ${OTP_COOLDOWN_SECONDS:45}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    # SOLO desarrollo: escribe el código en el log en vez de enviar correo
    mock-delivery: ${OTP_MOCK_DELIVERY:false}

# Logging configuration
logging:
  level:
    root: INFO
    com.aprendia.backend: ${LOGGING_LEVEL_APP:INFO}
    org.springframework.security: ${LOGGING_LEVEL_SECURITY:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_SQL:WARN}

# Monitoring
management:
  health:
    mail:
      enabled: false   # una caída del SMTP no debe marcar la API como DOWN
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Swagger / OpenAPI
springdoc:
  default-flat-param-object: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true
    filter: true
