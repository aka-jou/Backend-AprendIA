server:
  port: ${APP_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}

spring:
  application:
    name: aprendia-backend
  
  # Multipart properties
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # Database configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aprendiadb}
    username: ${SPRING_DATASOURCE_USERNAME:aprendia_app}
    # Sin valor por defecto: si falta la variable la aplicación no arranca (no hay credencial en el código)
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Correo SMTP (solo si MAIL_PROVIDER=smtp). Sin MAIL_HOST el envío falla de forma explícita.
  # Los tiempos de espera evitan que una petición quede colgada si el servidor SMTP no responde
  # (Railway fuera del plan Pro bloquea el SMTP saliente; ahí usar MAIL_PROVIDER=resend o brevo).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  # Flyway Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# JWT Config (Custom application properties)
app:
  jwt:
    # Obligatorio, sin valor por defecto (mínimo 32 caracteres para HS256)
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours in ms
    header: Authorization
    prefix: "Bearer "
  security:
    api-key-rotation:
      # "-" desactiva la rotación automática de API keys. Ej. trimestral: "0 0 0 1 1/3 ?"
      cron: ${API_KEY_ROTATION_CRON:-}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:4200}
  encryption:
    # Obligatorio, sin valor por defecto. De él se deriva la llave de cifrado de los campos sensibles
    secret: ${ENCRYPTION_SECRET}
  mail:
    # Canal de entrega del OTP, en minúsculas: smtp (por defecto) | resend | brevo
    provider: ${MAIL_PROVIDER:smtp}
    # Clave de la API del proveedor HTTP (resend / brevo). No se usa con smtp.
    api-key: ${MAIL_API_KEY:}
    from: ${MAIL_FROM:no-reply@aprendia.local}
    from-name: ${MAIL_FROM_NAME:AprendIA}
  otp:
    expiration-seconds: ${OTP_EXPIRATION_SECONDS:300}
    cooldown-seconds: ${OTP_COOLDOWN_SECONDS:45}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    # SOLO desarrollo: escribe el código en el log en vez de enviar correo
    mock-delivery: ${OTP_MOCK_DELIVERY:false}

# Logging configuration
logging:
  level:
    root: INFO
    com.aprendia.backend: ${LOGGING_LEVEL_APP:INFO}
    org.springframework.security: ${LOGGING_LEVEL_SECURITY:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_SQL:WARN}

# Monitoring
management:
  health:
    mail:
      enabled: false   # una caída del SMTP no debe marcar la API como DOWN
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Swagger / OpenAPI
springdoc:
  default-flat-param-object: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true
    filter: true
