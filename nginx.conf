# ==============================================================================
# Nginx Configuration for Subdomain: api-aprendia.it2id.cc
# ==============================================================================
# Purpose: Robust Reverse Proxy for Spring Boot running in Docker Compose.
# Integration: Configured to support Cloudflare proxy and Certbot (SSL).
# ==============================================================================

# Cloudflare Trusted IP Ranges (Restores original visitor IPs)
# Ref: https://www.cloudflare.com/ips/
# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Use the Cloudflare header to determine client IP
real_ip_header CF-Connecting-IP;

# HTTPS Server - Reverse Proxy to Spring Boot (Docker)
server {
    server_name api-aprendia.it2id.cc;

    # --------------------------------------------------------------------------
    # Cybersecurity & Hardening Settings
    # --------------------------------------------------------------------------
    
    # Hide Nginx version number in error pages and Server header
    server_tokens off;

    # Max body size (protects against large payload/DDoS, adjust if uploading files)
    client_max_body_size 10M;

    # Timeouts to prevent slowloris/DDoS attacks
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 10s;

    # Security Headers
    # Protects against Clickjacking, MIME-sniffing, and specifies safe policies
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Strict API Content Security Policy (disallows external script/frame execution)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --------------------------------------------------------------------------
    # Certbot Validation Path (HTTP Challenge)
    # --------------------------------------------------------------------------
    # Do NOT delete or modify this location. Certbot needs it to issue the SSL certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy to Spring Boot (Docker Compose Backend)
    # --------------------------------------------------------------------------
    location / {
        # Note: Change 127.0.0.1:8080 if your Spring Boot container exposes a different port on the host
        proxy_pass http://127.0.0.1:8080;

        # WebSockets and Keep-Alive support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward headers for correct client IP detection and SSL termination awareness in Spring Boot
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for the backend connection
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings: optimized for APIs
        proxy_buffering off;

        # Intercept errors to serve a custom fallback when the Spring Boot container is down/restarting
        proxy_intercept_errors on;
    }

    # Redirect gateway errors (502 Bad Gateway, 503 Service Unavailable, 504 Gateway Timeout)
    error_page 502 503 504 = @backend_down;

    # Custom API JSON response when backend is offline
    location @backend_down {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always; # Prevent CORS blocking on error response
        return 503 '{"timestamp": "$time_iso8601", "status": 503, "error": "Service Unavailable", "message": "The API server is currently offline or restarting. Please try again in a few moments."}';
    }

    # Certbot Managed SSL Settings
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api-aprendia.it2id.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api-aprendia.it2id.cc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api-aprendia.it2id.cc) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name api-aprendia.it2id.cc;
    return 404;
}

